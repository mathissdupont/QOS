[workspace]
members = [
  "crates/qos-abi",
  "crates/qos-gfx",          # Portable, resolution-agnostic drawing math (palette + scale). See ADR-0014.
  "crates/qos-ui",           # Portable modern-UI compositor core (surface, primitives, themes). See ADR-0017.
  "crates/qos-driver",       # Portable device/driver model core (host-tested). See ADR-0016.
  "crates/qos-acpi",         # Portable ACPI/MADT table parsing (host-tested). See ADR-0015 (E-10).
  "crates/qos-core",         # Portable control-plane core (no_std + alloc; std feature). See ADR-0003.
  # "crates/qosd",           # Disabled: daemon for host, uses std (re-enable with ADR-0011)
  # "crates/qos-pybridge",   # Disabled: Python bridge, uses std
  "crates/qos-os-kernel",    # Main kernel (no_std)
  "crates/qos-image",        # Bootable BIOS+UEFI image builder (bootloader 0.11). See ADR-0014.
  # "crates/qos-os-xtask",   # Disabled: uses std, we'll use bootimage directly
  # "crates/qos-userdemo",   # Disabled: linker error with _start symbol
]
resolver = "2"

# Shared package metadata inherited by crates that opt in with `license.workspace = true`.
# The whole repository is governed by the top-level LICENSE (AGPL-3.0-only) regardless.
[workspace.package]
license = "AGPL-3.0-only"
repository = "https://github.com/Heptapus-Open-Code-Organization/QOS"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
