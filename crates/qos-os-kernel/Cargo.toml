[package]
name = "os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "=0.9.29", features = ["map_physical_memory"] }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.9"
x86_64 = { version = "0.15", features = ["abi_x86_interrupt", "instructions"] }
pic8259 = "0.11"
pc-keyboard = "0.8"
linked_list_allocator = "0.10"
qos-abi = { path = "../qos-abi", default-features = false }
libm = "0.2"

[features]
default = []
userabi = []
userdemo = ["userabi"]
verify = []
fat = []  # Optional FAT16 filesystem support at /fat mount

[package.metadata.bootimage]
# QEMU command for bootimage runner
# Linux: uses system PATH (qemu-system-x86_64) in headless mode (for Docker/CI)
# Windows: uses installed path with GUI
# Override with QEMU_EXE environment variable if needed
run-command = ["qemu-system-x86_64", "-drive", "if=ide,index=0,media=disk,format=raw,file={}", "-nographic", "-serial", "mon:stdio"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
