[package]
name = "os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.9"
x86_64 = { version = "0.15", features = ["abi_x86_interrupt", "instructions"] }
pic8259 = "0.11"
pc-keyboard = "0.8"
linked_list_allocator = "0.10"
qos-abi = { path = "../qos-abi", default-features = false }
qos-gfx = { path = "../qos-gfx" }
qos-driver = { path = "../qos-driver" }
libm = "0.2"

[features]
default = ["userabi"]  # Enable user mode ABI by default
userabi = []
userdemo = ["userabi"]
verify = []
fat = []  # Optional FAT16 filesystem support at /fat mount

[build-dependencies]
cc = "1.0"

[package.metadata.bootimage]
# QEMU command for bootimage runner
# VNC mode: accessible at localhost:5900 (VNC display :0)
# Use RealVNC Viewer to connect to localhost:5900
run-command = ["qemu-system-x86_64", "-drive", "if=ide,index=0,media=disk,format=raw,file={}", "-vnc", ":0", "-serial", "mon:stdio"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
