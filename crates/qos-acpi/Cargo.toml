[package]
name = "qos-acpi"
version = "0.1.0"
edition = "2021"
description = "Portable ACPI table parsing for QOS (SDT headers, MADT/APIC topology). Pure byte parsing so it is host-tested; the kernel supplies physical-memory access. See ADR-0015 (E-10)."
