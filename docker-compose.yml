# Docker Compose for QaOS Development
version: '3.8'

services:
  qaos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qaos-dev
    volumes:
      # Mount source code for live editing
      - .:/qaos
      # Cache Cargo registry and build artifacts
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/qaos/target
    environment:
      # Display for QEMU GUI
      - DISPLAY=${DISPLAY:-:0}
    # Enable GUI forwarding (X11)
    network_mode: "host"
    stdin_open: true
    tty: true

volumes:
  cargo-registry:
  cargo-git:
  target:
