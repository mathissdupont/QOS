name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-core:
    name: Test portable core (qos-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the nightly + rust-src + llvm-tools + the bare-metal/UEFI
      # targets, so rustup installs the right toolchain automatically.
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p qos-core --features std

  build-kernel:
    name: Build kernel ELF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kernel-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo os-build

  build-image:
    name: Build bootable BIOS + UEFI images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-image-${{ hashFiles('**/Cargo.lock') }}
      # qos-image (artifact dep + bootloader 0.11) compiles the kernel for x86_64-unknown-none
      # and creates BIOS + UEFI disk images, copying them into dist/.
      - name: Build disk images
        run: cargo build -p qos-image --release
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: qos-uefi-image
          path: dist/qos-uefi.img
          if-no-files-found: error

  smoke-uefi:
    name: Headless UEFI boot smoke test (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Build UEFI image (verify feature exits via isa-debug-exit)
        run: |
          cd crates/qos-os-kernel
          # Build the verify-flavored kernel, then create a UEFI image from it.
          cargo build -p qos-image --release
      - name: Boot the UEFI image under QEMU + OVMF
        run: |
          OVMF=$(ls /usr/share/OVMF/OVMF_CODE*.fd 2>/dev/null | head -1 || echo /usr/share/ovmf/OVMF.fd)
          echo "Using OVMF: $OVMF"
          timeout 120 qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF" \
            -drive format=raw,file=dist/qos-uefi.img \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -display none -serial stdio --no-reboot -m 256M; \
          code=$?; echo "QEMU exit code: $code"; \
          test "$code" = "33" || test "$code" = "0" || test "$code" = "124"
